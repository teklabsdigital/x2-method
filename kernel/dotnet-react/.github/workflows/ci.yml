# TEST-3: the enforcement loop runs on every push. This is a TEMPLATE: at instantiation it moves to the repo root
# and every path here is relative to the edition root (server/, client-web/, tools/). Branch protection must
# require all five jobs (server, client, docs-lint, secret-scan, e2e-wire) before merge.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: server/**/packages.lock.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet test tests/Kernel.Tests.Architecture --no-build --verbosity normal
      - run: dotnet test tests/Kernel.Tests.Unit --no-build --verbosity normal
      - run: dotnet test tests/Kernel.Tests.Integration --no-build --verbosity normal

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: client-web/package-lock.json
      - run: npm ci
      - run: npm run verify

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # The predicates' own controls run first, the same ordering and the same reason as the secret scan below
      # (E-11, reproduced at this tool by E-28): a lint over a clean tree reports ok whether its predicates reach
      # everything or nothing, so the reach is asserted rather than assumed.
      - name: Assert what docs-lint catches (DOC-1, TEN-5, DEP-1)
        run: node tools/docs-lint.mjs --self-test
      - run: node tools/docs-lint.mjs
      # The gate readback's own controls. The live read is an instantiation step (it needs a token with
      # repository administration read), so what runs here is the predicate against its controls: this job
      # is the one place that would notice the readback rotting before a seeded project depends on it.
      - name: Assert what gate-check catches (TEST-3, HUM-1)
        run: node tools/gate-check.mjs --self-test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # The detector's own controls run first. This ordering is the point of E-11: the scan it replaces was a
      # regular expression in this file, which nobody could execute while editing it and which asserted nothing
      # about what it caught, so it was blind three ways for four rounds while reporting green every run.
      - name: Assert what the secret scan catches (SEC-5)
        run: node tools/secret-scan.mjs --self-test
      - name: Scan committed source and config for secrets (SEC-5)
        run: node tools/secret-scan.mjs

  e2e-wire:
    runs-on: ubuntu-latest
    services:
      sql:
        # Pinned tag@digest (DEP-1 / INV-05): the same engine build as the runbook and the Testcontainers fixture.
        image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04@sha256:c1aa8afe9b06eab64c9774a4802dcd032205d1be785b1fd51e1c0151e7586b74
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Ci_Harness_Pass123!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Harness_Pass123! -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      # The connection string for the service container above. Its password is a committed fixture for the reason
      # secret-scan.allow.json gives: a service container's env is resolved at workflow parse time and cannot read
      # a value a step produced. The signing key was never under that constraint, and is minted per run below.
      ConnectionStrings__Kernel: 'Server=localhost,1433;Database=Kernel;User Id=sa;Password=Ci_Harness_Pass123!;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: server/**/packages.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: client-web/package-lock.json
      # The runner's half of the division `scripts/e2e.sh` declares: this job decides how the client tier got its
      # node_modules, the script builds and drives it. The sibling edition's e2e job draws the line in the same place.
      - name: Install client
        working-directory: client-web
        run: npm ci
      # Minted per run, which is a consequence of the repair rather than a separate improvement: two copies of one
      # procedure each needed the value spelled out somewhere, and the cheapest place was a committed literal. One
      # procedure reading one environment variable makes a generated key the easy option, and it retires the entry
      # `secret-scan.allow.json` itself described as the weakest in its list (SEC-5).
      - name: Mint a per-run signing key
        run: echo "Jwt__Key=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")" >> "$GITHUB_ENV"
      # E-104's repair. This step used to be the whole of `scripts/e2e.sh` written out a second time: its own
      # readiness loop, its own mint calls, its own build, smoke and exit arithmetic. The finding named the cost
      # before it arrived, and then it arrived: E-107 added a build step to the script, this copy did not get it,
      # and a person reading the job is what caught it. The script now takes its database and its signing key from
      # the environment instead of from a developer's machine, so there is one procedure and this job runs it.
      #
      # The environment is the script's default, Development, and that is a change: this job used to boot
      # Production with the harness seam off. The seam is what a product's provider-port re-bindings compose under
      # (TEST-2 / INV-10), so a run with it off drives a different system than the tier is about. That was
      # invisible here only because the kernel ships no re-bindings, and every project seeded from this template
      # would have inherited it (E-114).
      - name: End to end (TEST-2 + the UI-5 smoke)
        run: scripts/e2e.sh
