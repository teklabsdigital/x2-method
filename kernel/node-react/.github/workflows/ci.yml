# TEST-3: the enforcement loop runs on every push. This is a TEMPLATE: at instantiation it moves to the repo root
# and every path here is relative to the edition root (server/, client-web/, tools/, scripts/). Branch protection
# must require every job below before merge, which `tools/gate-check.mjs` reads back by DERIVING the job names
# from this file. The enumeration that used to sit in this sentence is gone with the job it was about to omit: a
# hand-maintained list of jobs beside a workflow that already declares them is the drift the readback exists to
# catch, restated where nothing checks it.
#
# The e2e job below arrived last, and the two sentences it replaced are worth keeping in view. They said there was
# no e2e job "because this edition has no store, no auth, and no composed product surface to drive end to end",
# which was true when written and stopped being true one claim at a time. Nothing re-read them. That is E-39's
# shape as prose rather than as a CI exclusion: an argument for an absence outlives the condition it rests on,
# because the absence is what people see and the argument is what they skip.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run verify

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: client-web/package-lock.json
      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client-web/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client-web
      # TEST-2's deterministic tier. `scripts/e2e.ts` migrates a throwaway database, boots the real entrypoint on a
      # port nobody wrote down, drives the real client services against it with real bearer tokens, and boots the
      # composed entrypoint (UI-5) against the same server. It needs no engine service container, because the
      # store is `node:sqlite` and that is the runtime this job already has.
      - run: node scripts/e2e.ts

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      # The predicates' own controls run first, the same ordering and the same reason as the secret scan below
      # (E-11, reproduced at this tool by E-28): a lint over a clean tree reports ok whether its predicates reach
      # everything or nothing, so the reach is asserted rather than assumed.
      - name: Assert what docs-lint catches (DOC-1, TEN-5, DEP-1)
        run: node tools/docs-lint.mjs --self-test
      - run: node tools/docs-lint.mjs
      # The gate readback's own controls. The live read is an instantiation step (it needs a token with
      # repository administration read), so what runs here is the predicate against its controls: this job
      # is the one place that would notice the readback rotting before a seeded project depends on it.
      - name: Assert what gate-check catches (TEST-3, HUM-1)
        run: node tools/gate-check.mjs --self-test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      # The detector's own controls run first. This ordering is the point of E-11: the scan it replaces was a
      # regular expression in this file, which nobody could execute while editing it and which asserted nothing
      # about what it caught, so it was blind three ways for four rounds while reporting green every run.
      - name: Assert what the secret scan catches (SEC-5)
        run: node tools/secret-scan.mjs --self-test
      - name: Scan committed source and config for secrets (SEC-5)
        run: node tools/secret-scan.mjs
