# The kernel repository's own loop.
#
# Distinct from kernel/dotnet-react/.github/workflows/ci.yml, which is a TEMPLATE that moves to the repo root
# when a project is seeded and gates that project. Nothing was gating THIS repository, so the mechanisms it
# ships (the shared-tier compose check, the conformance-record check, the standing dash constraint) ran only
# when someone remembered. TEST-3 names that state exactly: a mechanism that runs only when a developer
# remembers is aspirational, not enforced. This closes it for the repository that makes the claim.
#
# Scope is the repo-level gates, the shared client tier, both editions' server tiers, and both editions' e2e tiers.
#
# It used to exclude the .NET tiers, and the exclusion was argued rather than an oversight: "they need an engine
# container and they gate a seeded project, not the catalog." The first half of that stopped being true and
# nothing re-examined it. E-49 made the engine tier SKIP with a named reason when no container runtime responds,
# and the architecture and unit tiers never needed one: 261 of the 265 .NET tests run against SQLite in memory or
# against no store at all. So the argument now excludes 261 tests on the strength of the 4 it describes.
#
# That mattered more than the count. E-39 recorded that no continuous process ran the .NET architecture suite, and
# named it as the reason E-29 and E-30 survived: both were guards narrowed to reach nothing, both required editing
# a file, and no loop would have reported either edit. Every guard this repository has built for the .NET edition
# has been protected only by whoever remembered to run it.
#
# The integration tier stays in the edition template, and the `dotnet-server` job below still names its two tiers
# rather than running `dotnet test` over the solution, which would pick up the third and either start pulling an
# engine image or skip it silently depending on what the runner happens to have.
#
# What has changed is the argument for that, and it is recorded rather than quietly kept. The reason used to be
# "this workflow has no engine"; as of 2026-07-28 it has one, because the dotnet-e2e job below starts the edition's
# own engine container in order to run the e2e tier. The remaining reason is only that the template covers the
# integration tier, which is the weaker half of what was originally two reasons. E-116 holds that with its trigger.
name: kernel

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shared-tier:
    name: shared tier composes and the editions match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # A hand-edited composed copy fails here rather than drifting quietly (kernel/shared/README.md).
      - run: node kernel/tools/compose.mjs --check

  conformance:
    name: every claim has an honest status in every edition
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every edition, not one. The job existed to prove a catalog pass cannot complete while an edition stays
      # silent, and running it against a single edition proved that of a single edition. The list is explicit
      # for the same reason compose.mjs keeps one: a new edition joining the gates should be a visible diff.
      matrix:
        edition: [dotnet-react, node-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # The predicates' own controls run first, for the reason E-11 established and E-28 reproduced one tool
      # over: a lint that walks a clean tree reports ok whether it reaches everything or nothing. Measured
      # 2026-07-27, narrowing the ledger row scrape and the image host allowlist left this job green both times,
      # and `compose --check` cannot see it because all three copies agree about doing nothing.
      - name: Assert what docs-lint catches (DOC-1, TEN-5, DEP-1)
        run: node tools/docs-lint.mjs --self-test
        working-directory: kernel/${{ matrix.edition }}
      # docs-lint carries the conformance check: a catalog claim with no row, a row naming no claim, a
      # realized claim naming no mechanism, an owed claim naming no trigger, or a stale generated table all
      # fail here. A catalog pass therefore cannot complete while an edition stays silent about a new claim.
      - run: node tools/docs-lint.mjs
        working-directory: kernel/${{ matrix.edition }}
      # Added 2026-07-27, and it is the third time this exact omission has been found (E-103). The gate readback
      # itself needs a token with repository administration read and is an instantiation step; what runs here is
      # its predicate against its own controls, which is the half that would notice the readback rotting before a
      # seeded project depends on it. Each edition's `ci.yml` has always run this, and each `ci.yml` is a template
      # that never executes here, which is E-95's structure exactly, one job along from where E-95 was found.
      - name: Assert what gate-check catches (TEST-3, HUM-1)
        run: node tools/gate-check.mjs --self-test
        working-directory: kernel/${{ matrix.edition }}

  loop:
    name: every mechanism an edition ships is run by something (TEST-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # The check that would have caught E-39, E-95 and E-103, each of which was found by a person running a
      # command they had not run in a while. E-95 closed with the right obligation addressed to the wrong kind of
      # reader: "when a mechanism is added to an edition, the pass owes an answer to whether anything in THIS
      # repository runs it". A person is exactly what TEST-3 says does not scale.
      - name: Assert what the loop check catches (TEST-3)
        run: node kernel/tools/loop-check.mjs --self-test
      - run: node kernel/tools/loop-check.mjs
      # The catalog's own gate. `conformance.mjs` reads the claim FILES, which is right and which means nothing
      # reached the catalog's index, its governance prose, or the skills: three findings came out of that gap in
      # one day (S-13, S-14, and a standing constraint on skills that nothing enforced). Controls first, the same
      # ordering as every other check here, and with one addition S-14 paid for: this tool prints what it
      # COMPARED, because the measurement that started S-14 matched nothing and reported clean.
      - name: Assert what the catalog check catches (S-13, S-14)
        run: node kernel/tools/catalog-check.mjs --self-test
      - run: node kernel/tools/catalog-check.mjs

  node-server:
    name: node-react server tier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel/node-react/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: kernel/node-react/server/package-lock.json
      - run: npm ci
      # tsc, vitest, eslint. The route-recorder completeness proofs and the framework import ban both run here,
      # which is what keeps the enumeration every future claim scan stands on from quietly becoming partial.
      - run: npm run verify

  node-e2e:
    name: node-react e2e tier (TEST-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            kernel/node-react/server/package-lock.json
            kernel/node-react/client-web/package-lock.json
      - run: npm ci
        working-directory: kernel/node-react/server
      - run: npm ci
        working-directory: kernel/node-react/client-web
      # E-80: this edition shipped the harness and the composed-entrypoint smoke as npm scripts and nothing ever
      # started either of them, so a whole assurance tier was built, wired, and had never executed against a
      # running server. E-84 then corrected the trigger: the artifact was buildable long before the run could be
      # GREEN, and adding this job while it was red on every run would have produced a job somebody skips, then
      # disables, then deletes. It is added now because the run passes, and it stays honest because the orchestrator
      # boots a real server, migrates a real schema and drives the real client services against it.
      #
      # No engine service container: the store is `node:sqlite`, which is the runtime, so the tier needs nothing
      # this runner does not already have. That is the difference from the sibling's integration tier and it is a
      # property of DB2's engine choice rather than of this job.
      - run: node kernel/node-react/scripts/e2e.ts

  dotnet-server:
    name: dotnet-react server tier (engine-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel/dotnet-react/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: kernel/dotnet-react/server/**/packages.lock.json
      # DEP-1: locked mode, so a lockfile that disagrees with the manifest fails here rather than resolving.
      - run: dotnet restore --locked-mode
      - run: dotnet build -warnaserror --no-restore
      # Named tiers, not the solution. The architecture tier is where every claim guard this repository has built
      # for this edition actually lives, and it is the one E-39 said nothing was running.
      - name: Architecture tier (the claim guards)
        run: dotnet test tests/Kernel.Tests.Architecture --no-build
      - name: Unit tier
        run: dotnet test tests/Kernel.Tests.Unit --no-build

  dotnet-e2e:
    name: dotnet-react e2e tier (TEST-2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: kernel/dotnet-react/server/**/packages.lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: kernel/dotnet-react/client-web/package-lock.json
      - run: npm ci
        working-directory: kernel/dotnet-react/client-web
      # Nothing secret-shaped is committed anywhere in this job, and that is a property of starting the engine
      # with the edition's own script rather than declaring a service container. A `services:` block is resolved
      # at workflow parse time and cannot read a value a step produced, which is precisely why the template's copy
      # of this password has to be committed and allowlisted (SEC-5). A script reads its environment at step time,
      # so both values here are generated per run and neither is in the tree.
      - name: Generate this run's engine password and signing key
        run: |
          RANDOM_HEX="process.stdout.write(require('crypto').randomBytes(24).toString('hex'))"
          {
            echo "MSSQL_SA_PASSWORD=Kernel-ci-$(node -e "$RANDOM_HEX")"
            echo "Jwt__Key=$(node -e "$RANDOM_HEX")"
          } >> "$GITHUB_ENV"
      # Started by the edition's own script, which reads the pinned tag@digest from its edition.json rather than
      # restating it. A `services:` block here would have been a fifth independent copy of that value and the only
      # one no tool compares, since docs-lint is edition-scoped and cannot see this file (E-64, E-105).
      - name: Start the engine
        run: kernel/dotnet-react/scripts/db-up.sh
      # E-104's other half, and the one that is about THIS repository. That edition's `ci.yml` is a template which
      # never executes here, so until this job existed nothing in this repository had ever run the sibling's e2e:
      # every green it has ever had came from a person choosing to run it. That is the state E-39, E-95 and E-103
      # were each found in. It fits in one line because the script now takes its database and its signing key from
      # the environment instead of from a developer's machine.
      - name: End to end (TEST-2 + the UI-5 smoke)
        env:
          ConnectionStrings__Kernel: 'Server=localhost,1433;Database=Kernel;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True'
        run: kernel/dotnet-react/scripts/e2e.sh

  secret-scan:
    name: no committed secrets in either edition (SEC-5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [dotnet-react, node-react]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      # Added 2026-07-27 because it was missing, and its absence had already cost something. Each edition's own
      # `ci.yml` runs this scan, and each `ci.yml` is a TEMPLATE that runs only after a project is seeded, so
      # nothing in this repository had ever executed it. DB2 then introduced a secret-shaped leaf into
      # `dotnet-react/edition.json` and the scan has been failing, unobserved, ever since (E-95).
      #
      # This is E-39's shape a second time, in the same workflow that E-39 was about: a mechanism this repository
      # ships, and tells its readers to rely on, running only when someone remembers. The detector's own controls
      # run first for the reason E-11 established, because a scan over a clean tree reports ok whether it reaches
      # everything or nothing.
      - name: Assert what the secret scan catches (SEC-5)
        run: node tools/secret-scan.mjs --self-test
        working-directory: kernel/${{ matrix.edition }}
      - name: Scan committed source and config for secrets (SEC-5)
        run: node tools/secret-scan.mjs
        working-directory: kernel/${{ matrix.edition }}

  client:
    name: shared client tier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel/shared/client-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: kernel/shared/client-web/package-lock.json
      - run: npm ci
      - run: npm run verify

  dashes:
    name: no em or en dash anywhere (MET-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The edition's docs-lint enforces this inside the edition only. The standing constraint is repo-wide,
      # so the catalog, the skills, the record layer, and the root documents are covered here. The characters
      # are built with printf because BSD and GNU grep bracket expressions both false-negative on them.
      - name: Scan for em and en dashes
        run: |
          FOUND=0
          for CH in $(printf '\342\200\224') $(printf '\342\200\223'); do
            if git grep -n -I --fixed-strings -- "$CH" -- . \
              ':(exclude)*package-lock.json' ':(exclude)*packages.lock.json' ; then
              FOUND=1
            fi
          done
          if [ "$FOUND" -ne 0 ]; then
            echo "Em or en dash found; the standing constraint bans both everywhere (MET-08)."
            exit 1
          fi
          echo "No em or en dashes found."
